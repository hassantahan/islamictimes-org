{% extends "base.html" %}
{% block title %}Crescent Visibilities{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
  <div>
    <label for="month-select" class="block text-sm font-medium mb-1">Month</label>
    <select id="month-select" class="w-full border rounded px-3 py-2 dark:bg-gray-700 dark:border-gray-600"></select>
  </div>

  <div>
    <label for="year-select" class="block text-sm font-medium mb-1">Year</label>
    <select id="year-select" class="w-full border rounded px-3 py-2 dark:bg-gray-700 dark:border-gray-600"></select>
  </div>
</section>

<section class="max-w-6xl mx-auto">
  <img id="map-output" class="w-full border rounded-lg shadow dark:border-gray-600" src="" alt="Visibility map will appear here">
</section>

<section class="max-w-3xl mx-auto space-y-4">
  <h2 class="text-lg font-semibold mb-2">Crescent Visibility at Your Location</h2>

  <div class="overflow-x-auto">
    <table id="vis-table" class="min-w-full bg-white dark:bg-gray-800 shadow rounded-lg">
      <thead>
        <tr>
          <th class="px-4 py-2 text-left">Date & Time</th>
          <th class="px-4 py-2 text-left">Q Value</th>
          <th class="px-4 py-2 text-left">Category</th>
          <th class="px-4 py-2 text-left">Description</th>
        </tr>
      </thead>
      <tbody id="vis-body" class="divide-y"></tbody>
    </table>
  </div>

  <div id="vis-criterion" class="mt-2 text-sm text-gray-600 dark:text-gray-400"></div>

  <input type="text" id="city" placeholder="City / Address" autocomplete="off"
         class="w-full border rounded px-3 py-2 dark:bg-gray-700 dark:border-gray-600"/>
  <ul id="autocomplete-suggestions"
      class="border bg-white dark:bg-gray-700 dark:border-gray-600 rounded hidden max-h-40 overflow-y-auto"></ul>

  <div class="flex space-x-4">
    <input type="number" id="lat" min="-90" max="90" step="0.000001" placeholder="Latitude" class="flex-1 border rounded px-3 py-2 dark:bg-gray-700 dark:border-gray-600">
    <input type="number" id="lon" min="-180" max="180" step="0.000001" placeholder="Longitude" class="flex-1 border rounded px-3 py-2 dark:bg-gray-700 dark:border-gray-600">
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <button id="use-gps" class="w-full bg-blue-500 text-white py-2 rounded-lg" type="button">Use Precise GPS</button>
    <button id="use-manual" class="w-full bg-emerald-600 text-white py-2 rounded-lg" type="button">Use Manual Location</button>
  </div>

  <div id="map-container" class="w-full h-48 bg-gray-300 dark:bg-gray-700 rounded-lg overflow-hidden">
    <iframe id="map" class="w-full h-full" src="" frameborder="0" scrolling="no" loading="lazy"></iframe>
  </div>
</section>

<div id="map-spinner" class="fixed inset-0 flex items-center justify-center bg-white/70 dark:bg-black/70 hidden">
  <img src="{{ url_for('static', filename='img/spinner.svg') }}" class="w-20 h-20 animate-spin" alt="Loading">
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/visibilities.js', v='20260228-4') }}"></script>
{% endblock %}
